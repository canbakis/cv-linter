[package]
name = "cv-linter"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local, evidence-oriented CV linting"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rmcp = { version = "3.3.0", default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.27.0"
