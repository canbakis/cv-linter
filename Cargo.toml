[package]
name = "cv-linter"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Local, evidence-oriented CV extraction and deterministic linting"
authors = ["Can Bakis"]
repository = "https://github.com/canbakis/cv-linter"
homepage = "https://github.com/canbakis/cv-linter"
readme = "README.md"
keywords = ["cv", "resume", "linter", "mcp"]
categories = ["command-line-utilities", "text-processing"]
include = [
    "/src/**",
    "/dictionaries/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/rust-toolchain.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/THIRD-PARTY-LICENSES.html",
]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rmcp = { version = "3.3.0", default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
spellbook = { version = "=0.4.2", default-features = false, features = ["default-hasher"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
unicode-general-category = "1.1.0"
xberg = { version = "=1.1.5", default-features = false, features = ["tokio-runtime", "pdf", "office"] }

[dev-dependencies]
base64 = "=0.23.1"
tempfile = "3.27.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }

[profile.release]
strip = "symbols"

# Release artifacts are built by dist with thin LTO for smaller binaries.
[profile.dist]
inherits = "release"
lto = "thin"
